repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key

  # ruff и mypy берём из backend/.venv, чтобы версии совпадали с pyproject.toml
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: bash -c 'cd backend && .venv/bin/ruff check --fix .'
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && .venv/bin/ruff format .'
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && .venv/bin/mypy app tests'
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
