<html><body><template style="display:none" id="HH-Lux-InitialState">{&quot;vacancyView&quot;: {&quot;vacancyFull&quot;: {&quot;vacancy&quot;: {&quot;vacancyId&quot;: 139080109, &quot;name&quot;: &quot;Fullstack Developer (React / TypeScript / NestJS), Strong Middle&quot;, &quot;description&quot;: &quot;&lt;p&gt;&lt;strong&gt;О нас&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Мы разрабатываем собственные программные продукты для автоматизации бизнеса и работы с данными.&lt;/p&gt; &lt;p&gt;Сейчас ищем опытного Fullstack-разработчика в небольшую продуктовую команду для развития двух взаимосвязанных систем:&lt;/p&gt; &lt;p&gt;&lt;strong&gt;INTERA&lt;/strong&gt; — современная платформа операционного контроля бизнеса. Она объединяет данные из разных источников, позволяет создавать метрики, дашборды, автоматические сверки, управлять бизнес-объектами и контролировать бизнес-процессы.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Enigma&lt;/strong&gt; — действующая коммерческая система биллинга и управления услугами для телекоммуникационных компаний.&lt;/p&gt; &lt;p&gt;Основная работа будет связана с развитием INTERA Core и интеграцией с Enigma через API. Поддерживать или переписывать legacy API Enigma не потребуется — этим занимается другая команда.&lt;/p&gt; &lt;p&gt; &lt;/p&gt; &lt;p&gt;&lt;strong&gt;Чем предстоит заниматься&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Разрабатывать новые интерфейсы и функциональность INTERA Core на React и TypeScript.&lt;/li&gt; &lt;li&gt;Создавать интерактивные формы, мастера настройки (wizards), редакторы, таблицы и переиспользуемые UI-компоненты.&lt;/li&gt; &lt;li&gt;Разрабатывать визуальные редакторы бизнес-объектов, метрик, интеграций и конфигураций.&lt;/li&gt; &lt;li&gt;Реализовывать обмен данными между INTERA и Enigma через REST API.&lt;/li&gt; &lt;li&gt;Дорабатывать backend-функциональность на NestJS, необходимую для новых интерфейсов и интеграций.&lt;/li&gt; &lt;li&gt;Работать с PostgreSQL, MS SQL, моделями данных и бизнес-логикой.&lt;/li&gt; &lt;li&gt;Улучшать существующий интерфейс, производительность и удобство использования системы.&lt;/li&gt; &lt;li&gt;Участвовать в проектировании новых функций, обсуждать решения и предлагать улучшения.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt; &lt;/p&gt; &lt;p&gt;&lt;strong&gt;Наш технологический стек&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Frontend:&lt;/strong&gt; React 19, TypeScript, React Router, Vite, CSS, собственная дизайн-система&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Backend:&lt;/strong&gt; Node.js, NestJS, TypeORM, PostgreSQL, MS SQL.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Интеграции:&lt;/strong&gt; REST API, JSON, Swagger/OpenAPI, SQL, YAML.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Инфраструктура:&lt;/strong&gt; Docker, Git, Linux.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Тестирование:&lt;/strong&gt; Jest, Vitest, React Testing Library&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt; &lt;/p&gt; &lt;p&gt;&lt;strong&gt;Что мы ожидаем&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Коммерческий опыт разработки от 3 лет.&lt;/li&gt; &lt;li&gt;Уверенное владение TypeScript, React и современным JavaScript.&lt;/li&gt; &lt;li&gt;Опыт создания сложных интерактивных интерфейсов, а не только простых веб-страниц.&lt;/li&gt; &lt;li&gt;Хорошее понимание архитектуры React-приложений, состояния компонентов и взаимодействия с API.&lt;/li&gt; &lt;li&gt;Опыт backend-разработки на Node.js, желательно NestJS.&lt;/li&gt; &lt;li&gt;Уверенная работа с SQL.&lt;/li&gt; &lt;li&gt;Понимание REST API, клиент-серверного взаимодействия и обработки ошибок.&lt;/li&gt; &lt;li&gt;Самостоятельность, ответственность за результат и умение предлагать технические решения.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt; &lt;/p&gt; &lt;p&gt;&lt;strong&gt;Будет преимуществом&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Опыт разработки ERP, CRM или других сложных бизнес-систем.&lt;/li&gt; &lt;li&gt;Опыт создания конструкторов форм, визуальных редакторов, мастеров настройки и динамических интерфейсов.&lt;/li&gt; &lt;li&gt;Разработка собственных библиотек UI-компонентов.&lt;/li&gt; &lt;li&gt;Опыт интеграций с внешними бизнес-системами.&lt;/li&gt; &lt;li&gt;Понимание принципов работы с LLM и AI API.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt; &lt;/p&gt; &lt;p&gt;&lt;strong&gt;Что предлагаем&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Зарплата &lt;strong&gt;140 000–200 000 рублей в месяц до налогов&lt;/strong&gt;, по результатам собеседования.&lt;/li&gt; &lt;li&gt;Полностью удалённая работа из любого региона России.&lt;/li&gt; &lt;li&gt;Полная занятость, долгосрочное сотрудничество.&lt;/li&gt; &lt;li&gt;Небольшая команда и прямое общение с руководителями разработки.&lt;/li&gt; &lt;li&gt;Минимум бюрократии, возможность влиять на технические решения.&lt;/li&gt; &lt;li&gt;Работа над собственными продуктами, а не заказными сайтами.&lt;/li&gt; &lt;li&gt;Интересные задачи на стыке frontend, backend, интеграций и бизнес-логики.&lt;/li&gt; &lt;li&gt;Возможность участвовать в развитии новой платформы, включая будущие AI-функции.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt; &lt;/p&gt;&lt;p&gt;В сопроводительном письме укажите слово «Тигр».&lt;/p&gt;&quot;, &quot;keySkills&quot;: [&quot;TypeScript&quot;, &quot;Linux&quot;]}}}, &quot;applicantVacancyResponseStatuses&quot;: {&quot;139080109&quot;: {&quot;test&quot;: {&quot;hasTests&quot;: true, &quot;testId&quot;: 1, &quot;required&quot;: false}, &quot;shortVacancy&quot;: {&quot;vacancyId&quot;: 139080109, &quot;responseLetterRequired&quot;: true}}}}</template></body></html>
